name: CI

# Runs on every push and PR. Playwright/e2e stays out of this workflow until
# Phase 7.1 wires up docker-compose Postgres in CI — until then it's a
# local-only check (see e2e/home.spec.ts, package.json's `e2e` script).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Bun is both the package manager and (via --bun) the runtime the app
      # ships with in prod, so CI installs/runs through the same binary
      # rather than falling back to Node for "just CI".
      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile refuses to resolve new versions here: CI should
      # fail loudly if bun.lock drifts from package.json, not silently
      # install something nobody reviewed.
      - run: bun install --frozen-lockfile

      # typecheck -> lint -> format check -> unit tests, in that order so
      # the cheapest/most-informative failure surfaces first.
      - run: bun run check

      # next.config.js validates env vars (src/env.js) at build startup, so the build needs *a*
      # value for every required var even though nothing ever connects/authenticates during it —
      # the home route is dynamic (server-rendered per request, not statically generated), and
      # nothing hits /api/auth/* either, so these placeholders only exist to satisfy Zod, never
      # to do real work. (Phase 2.2 finding: BETTER_AUTH_SECRET/URL became required in 2.1 but
      # this workflow wasn't updated at the time — main's build had been silently red since,
      # unnoticed because that commit pushed straight to main instead of through a PR.)
      - run: bun run build
        env:
          DATABASE_URL: postgres://ambit:ambit@localhost:5432/ambit
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
          BETTER_AUTH_URL: http://localhost:3000
