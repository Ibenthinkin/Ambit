<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F2F2F2; text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: #FFFFFF; }
    @keyframes ambitfade { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes ambitrise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    image-slot { display: block; }
  </style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#060606; padding:32px; font-family:'Hanken Grotesk', sans-serif;">

  <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="ambit-slot-stub" hint-size="1px,1px" style="position:absolute; width:0; height:0; overflow:hidden; opacity:0; pointer-events:none;"></x-import>

  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ deviceDark }}" hint-size="402px,874px">
    <div style="position:relative; height:100%;">

      <div style="height:100%; overflow-y:auto; background:#0E0E0E; -webkit-overflow-scrolling:touch;">


        <div style="padding:60px 20px 120px; animation:ambitrise .45s ease both;">
          <a href="Ambit - Profile.dc.html" style="display:inline-flex; width:28px; height:28px; align-items:center; text-decoration:none; margin-bottom:10px;"><svg width="10" height="18" viewBox="0 0 12 22" fill="none" stroke="#F2F2F2" stroke-width="2"><path d="M11 1L1 11l10 10"></path></svg></a>
          <div style="font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:56px; line-height:0.9; text-transform:uppercase; color:#F2F2F2;">Settings</div>

          <div style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.14);">
            <a href="Ambit - Profile Edit.dc.html" style="display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.14); text-decoration:none;">
              <sc-if value="{{ hasAvatar }}" hint-placeholder-val="{{ false }}">
                <image-slot id="ambit-avatar" shape="circle" src="{{ avatarSrc }}" placeholder="Photo" style="width:44px; height:44px; flex-shrink:0;"></image-slot>
              </sc-if>
              <sc-if value="{{ noAvatar }}" hint-placeholder-val="{{ true }}">
                <span style="width:44px; height:44px; flex-shrink:0; border-radius:50%; background:#2A2A2A; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:21px; color:#F2F2F2;">{{ initial }}</span>
              </sc-if>
              <div style="flex:1;">
                <div style="font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:22px; line-height:1; text-transform:uppercase; color:#F2F2F2;">{{ name }}</div>
                <div style="font-family:'Geist Mono', monospace; font-size:10px; text-transform:uppercase; color:#8A8A8A; margin-top:4px;">Edit profile</div>
              </div>
              <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#6A6A6A" stroke-width="1.6"><path d="M1 1l6 6-6 6"></path></svg>
            </a>
            <a href="Ambit - Saved.dc.html" style="display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.14); text-decoration:none;">
              <span style="width:44px; height:44px; flex-shrink:0; border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center;"><svg width="15" height="18" viewBox="0 0 24 30"><path d="M2 2h20v26l-10-6.4L2 28z" fill="none" stroke="#F2F2F2" stroke-width="1.8" stroke-linejoin="round"></path></svg></span>
              <div style="flex:1;">
                <div style="font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:22px; line-height:1; text-transform:uppercase; color:#F2F2F2;">Everything kept</div>
                <div style="font-family:'Geist Mono', monospace; font-size:10px; text-transform:uppercase; color:#8A8A8A; margin-top:4px;">{{ savedLabel }}</div>
              </div>
              <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#6A6A6A" stroke-width="1.6"><path d="M1 1l6 6-6 6"></path></svg>
            </a>
          </div>

          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
            <div>
              <div style="font-family:'Geist Mono', monospace; font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color:#7A7A7A; padding:26px 0 8px; border-bottom:1px solid rgba(255,255,255,0.14);">{{ g.title }}</div>
              <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
                <div onClick="{{ r.onClick }}" style="display:flex; align-items:center; gap:8px; padding:13px 0; border-bottom:1px solid rgba(255,255,255,0.08); cursor:pointer;">
                  <span style="flex:1; font-size:15px; color:#EDEDED;">{{ r.label }}</span>
                  <sc-if value="{{ r.warn }}" hint-placeholder-val="{{ false }}"><span style="width:6px; height:6px; border-radius:50%; background:#2BB24C;"></span></sc-if>
                  <sc-if value="{{ r.hasValue }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Geist Mono', monospace; font-size:10.5px; text-transform:uppercase; color:#8A8A8A;">{{ r.value }}</span></sc-if>
                  <sc-if value="{{ r.hasAction }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:15px; text-transform:uppercase; background:#F2F2F2; color:#0E0E0E; padding:5px 11px;">{{ r.action }}</span></sc-if>
                  <sc-if value="{{ r.hasChevron }}" hint-placeholder-val="{{ true }}"><svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#6A6A6A" stroke-width="1.6"><path d="M1 1l6 6-6 6"></path></svg></sc-if>
                </div>
              </sc-for>
            </div>
          </sc-for>

          <div style="font-family:'Geist Mono', monospace; font-size:10px; text-transform:uppercase; color:#5A5A5A; margin-top:30px;">Ambit · invite-only · v0.4</div>
        </div>
      </div>

      <sc-if value="{{ toast.active }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; left:50%; bottom:46px; z-index:50; background:#F2F2F2; color:#0E0E0E; font-family:'Geist Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.3px; padding:10px 14px; white-space:nowrap; animation:ambitfade .22s ease both;">{{ toast.text }}</div>
      </sc-if>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:466,&quot;height&quot;:938}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { toast: null, profile: this.loadProfile(), savedCount: this.loadSavedCount() };
  }
  loadProfile() {
    const base = { name: 'Ben', handle: '@ibenthinkin', avatar: '' };
    try { return Object.assign(base, JSON.parse(localStorage.getItem('ambit.profile.v1') || '{}')); }
    catch (e) { return base; }
  }
  loadSavedCount() {
    try { return (JSON.parse(localStorage.getItem('ambit.saved.v1') || '[]') || []).length; }
    catch (e) { return 0; }
  }
  componentWillUnmount() { if (this.toastTimer) clearTimeout(this.toastTimer); }
  flash(text) {
    if (this.toastTimer) clearTimeout(this.toastTimer);
    this.setState({ toast: text });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 1700);
  }

  renderVals() {
    const p = this.state.profile;
    const go = (href) => () => { window.location.href = href; };
    const mk = (rows) => rows.map((r) => ({
      key: r.label, label: r.label,
      value: r.value || '', hasValue: !!r.value,
      action: r.action || '', hasAction: !!r.action,
      hasChevron: !r.action, warn: !!r.warn,
      onClick: r.onClick || (() => this.flash(r.label + ' \u00b7 coming soon')),
    }));

    const groups = [
      { key: 'account', title: 'Account', rows: mk([
        { label: 'Account details', onClick: go('Ambit - Profile Edit.dc.html') },
        { label: 'Invite a friend', value: '2 left' },
        { label: 'Add to home screen', action: 'Install', onClick: go('Ambit - Install.dc.html') },
      ]) },
      { key: 'feed', title: 'Your feed', rows: mk([
        { label: 'What you see', value: 'Art, science, history' },
        { label: 'Muted sources', value: 'None' },
        { label: 'Serendipity', value: 'Often' },
      ]) },
      { key: 'permissions', title: 'Permissions', rows: mk([
        { label: 'Camera roll', value: 'Not set' },
        { label: 'Notifications', value: 'Off', warn: true },
      ]) },
      { key: 'other', title: 'Other', rows: mk([
        { label: 'Appearance', value: 'Dark' },
        { label: 'Language', value: 'English' },
        { label: 'About Ambit' },
        { label: 'Get in touch' },
      ]) },
    ];

    return {
      deviceDark: true,
      name: p.name,
      initial: ((p.name || 'B').trim().charAt(0) || 'B').toUpperCase(),
      avatarSrc: p.avatar || '', hasAvatar: !!p.avatar, noAvatar: !p.avatar,
      savedLabel: this.state.savedCount === 1 ? '1 save' : this.state.savedCount + ' saves',
      groups,
      toast: { active: !!this.state.toast, text: this.state.toast || '' },
    };
  }
}
</script>
</body>
</html>
