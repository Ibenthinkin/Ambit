<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    @keyframes ambitrise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ambitspin { to { transform: rotate(360deg); } }
    input.ambit-input::placeholder { color: rgba(239,235,224,0.32); }
    input.ambit-input:focus { border-color: var(--ambit-accent) !important; }
  </style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0C0B09; padding:32px; font-family:'Sora', -apple-system, system-ui, sans-serif;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ deviceDark }}" hint-size="402px,874px">
    <div style="position:relative; height:100%; overflow:hidden; background:#161411;">

      <!-- quick-succession imagery -->
      <div style="position:absolute; inset:0; overflow:hidden; background:#0C0B09;">
        <sc-for list="{{ slides }}" as="slide" hint-placeholder-count="6">
          <div style="{{ slide.style }}"></div>
        </sc-for>
      </div>
      <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(12,11,9,0.62) 0%, rgba(12,11,9,0.3) 30%, rgba(12,11,9,0.55) 66%, rgba(12,11,9,0.85) 100%);"></div>

      <!-- backdrop scrim behind sheet -->
      <div onClick="{{ onScrimClick }}" style="{{ scrimStyle }}"></div>

      <!-- bottom sheet -->
      <div style="{{ sheetStyle }}">
        <div style="display:flex; justify-content:center;">
          <div onClick="{{ onCollapse }}" style="width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(239,235,224,0.06); border:0.5px solid rgba(239,235,224,0.12); cursor:pointer; margin-bottom:20px;">
            <svg width="30" height="30" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="none" stroke="{{ accent }}" stroke-width="1.6"/><circle cx="13" cy="13" r="3.4" fill="{{ accent }}"/><circle cx="21" cy="7" r="1.8" fill="{{ accent }}"/></svg>
          </div>
        </div>

        <div style="text-align:left;">
          <div style="font-family:'Sora', sans-serif; font-weight:400; font-size:16px; line-height:1.2; letter-spacing:0.1px; color:#F5F1E7; white-space:nowrap;">A quieter way to be curious.</div>
          <div style="font-family:'Sora', sans-serif; font-weight:400; font-size:14.5px; line-height:1.55; color:rgba(239,235,224,0.6); margin-top:10px; max-width:320px;">No feeds engineered to keep you. Ambit hands you one interesting thing at a time, then quietly steps back.</div>
          <div style="font-family:'Sora', sans-serif; font-weight:400; font-size:16px; letter-spacing:0.1px; color:#F5F1E7; margin-top:14px;">Ambit</div>
        </div>

        <div style="margin-top:26px;">

          <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
            <div>
              <div style="position:relative; display:flex; align-items:center; justify-content:flex-start;">
                <input class="ambit-input" ref="{{ emailRef }}" type="email" inputmode="email" placeholder="Email address" value="{{ email }}" onInput="{{ onInput }}" onKeyDown="{{ onKey }}" style="{{ inputStyle }}" />
                <sc-if value="{{ canSend }}" hint-placeholder-val="{{ false }}">
                  <div onClick="{{ onSubmit }}" style="{{ arrowStyle }}">
                    <sc-if value="{{ sending }}" hint-placeholder-val="{{ false }}">
                      <span style="width:13px; height:13px; border-radius:50%; border:2px solid rgba(239,235,224,0.3); border-top-color:{{ accent }}; animation:ambitspin .8s linear infinite; display:inline-block;"></span>
                    </sc-if>
                    <sc-if value="{{ notSending }}" hint-placeholder-val="{{ true }}">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ accent }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    </sc-if>
                  </div>
                </sc-if>
              </div>
              <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
                <div style="font-family:'Sora', sans-serif; font-size:12.5px; color:#D98C6A; margin-top:11px; text-align:left;">{{ error }}</div>
              </sc-if>
              <div style="display:flex; align-items:center; justify-content:flex-start; gap:7px; margin-top:20px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(239,235,224,0.4)" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                <span style="font-family:'Sora', sans-serif; font-size:11.5px; color:rgba(239,235,224,0.4); letter-spacing:0.2px;">Invite-only</span>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ isSent }}" hint-placeholder-val="{{ false }}">
            <div style="text-align:left; padding:6px 0 20px; animation:ambitrise .5s ease both;">
              <div style="width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(239,235,224,0.06); border:0.5px solid rgba(239,235,224,0.12);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{ accent }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              </div>
              <div style="font-family:'Sora', sans-serif; font-weight:600; font-size:20px; color:#F3EFE5; margin-top:16px;">Check your inbox</div>
              <div style="font-family:'Sora', sans-serif; font-size:14px; line-height:1.5; color:rgba(239,235,224,0.6); margin-top:8px;">We sent a magic link to<br><span style="color:{{ accent }};">{{ email }}</span>. Tap it and you're in.</div>
              <div onClick="{{ onReset }}" style="font-family:'Sora', sans-serif; font-size:13px; font-weight:600; color:rgba(239,235,224,0.5); margin-top:18px; cursor:pointer; display:inline-block;">Use a different email</div>
            </div>
          </sc-if>

        </div>
      </div>

      <!-- floating collapsed glyph -->
      <sc-if value="{{ showFloating }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ onExpand }}" style="position:absolute; left:50%; bottom:28px; transform:translateX(-50%); z-index:6; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(27,24,21,0.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:0.5px solid rgba(239,235,224,0.14); cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,0.4);">
          <svg width="30" height="30" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="none" stroke="{{ accent }}" stroke-width="1.6"/><circle cx="13" cy="13" r="3.4" fill="{{ accent }}"/><circle cx="21" cy="7" r="1.8" fill="{{ accent }}"/></svg>
        </div>
      </sc-if>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4C5FE0&quot;,&quot;options&quot;:[&quot;#4C5FE0&quot;,&quot;#D9A73C&quot;,&quot;#3FA35C&quot;,&quot;#D9483F&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Landing&quot;},&quot;slideMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1200,&quot;min&quot;:400,&quot;max&quot;:2400,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Landing&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.emailRef = React.createRef();
    this.state = { email: '', stage: 'form', sending: false, error: '', slide: 0, modalOpen: false };
    this.SLIDES = [
      'https://commons.wikimedia.org/wiki/Special:FilePath/Great%20Wave%20off%20Kanagawa2.jpg?width=900',
      'https://commons.wikimedia.org/wiki/Special:FilePath/Pillars%20of%20Creation.jpg?width=900',
      'https://commons.wikimedia.org/wiki/Special:FilePath/Rain%20Steam%20and%20Speed%20the%20Great%20Western%20Railway.jpg?width=900',
      'https://commons.wikimedia.org/wiki/Special:FilePath/Vanderbilt%20Cup%201908.jpg?width=900',
      'https://commons.wikimedia.org/wiki/Special:FilePath/Hubble%20ultra%20deep%20field%20high%20rez%20edit1.jpg?width=900',
      'https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20-%20Wheatfield%20with%20crows%20-%20Google%20Art%20Project.jpg?width=900',
      'https://commons.wikimedia.org/wiki/Special:FilePath/Haeckel%20Discomedusae%2088.jpg?width=900',
      'https://commons.wikimedia.org/wiki/Special:FilePath/Johannes%20Vermeer%20-%20Het%20melkmeisje%20-%20Google%20Art%20Project.jpg?width=900',
      'uploads/c04307597746d91a67159a0298341e504d9bd8d260aa85fe201cee00325fa645.webp',
      'uploads/f2001f4b4c65112c45584d468b22b57b7aa0463bb7bdc0bcb65d9a359ced72dd.webp',
      'uploads/a7cf5ec1c28b5503e6ade49eaea62d75aa2516ed57e3e24a18b19d259379b013.webp',
      'uploads/a79f3e146eb4aa1698ade8109e066ffcdc0b3d9bba1cce7bddb7643a2d6d6c97.webp',
      'uploads/a718fbfa91f5eab2a8b790184129915644ba1673ce2d3f684ed83580592e763c.webp',
      'uploads/bc7ceb0611e59649a66717f12cd8db6965a0d91d4c7fc84c84afc163651364b2.webp',
      'uploads/c00a19218be087d6936d118bd375a7a78a2e683fa55125d5e03046ac800164ab.webp',
      'uploads/c0247c09ced869330c4006506a0de4000a212b0ca41cd2799c612a3cdefba914.webp',
      'uploads/3808901ae9a0706934b584c349ab68fde90e38060f0ba217883c6040265a6bb7.webp',
    ];
  }

  shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  componentDidMount() {
    this.SLIDES = this.shuffle(this.SLIDES);
    // Image list is editable in assets/landing-slides.json (falls back to the built-in list)
    fetch('assets/landing-slides.json')
      .then(r => r.json())
      .then(d => {
        if (d && Array.isArray(d.slides) && d.slides.length) {
          this.SLIDES = this.shuffle(d.slides);
          this.setState({ slide: 0 });
          this.startCycle();
        }
        this.SLIDES.forEach(src => { const i = new Image(); i.src = src; });
      })
      .catch(() => { this.SLIDES.forEach(src => { const i = new Image(); i.src = src; }); });
    this.startCycle();
  }
  componentDidUpdate(prev) {
    const a = prev.slideMs ?? 1200, b = this.props.slideMs ?? 1200;
    if (a !== b && !this.state.modalOpen) this.startCycle();
  }
  componentWillUnmount() { if (this.cycle) clearInterval(this.cycle); }

  startCycle() {
    if (this.cycle) clearInterval(this.cycle);
    const ms = Math.max(320, this.props.slideMs ?? 1200);
    this.cycle = setInterval(() => {
      this.setState(s => {
        const next = s.slide + 1;
        if (next >= this.SLIDES.length) {
          clearInterval(this.cycle);
          setTimeout(() => this.setState({ modalOpen: true }), 260);
          return { slide: this.SLIDES.length - 1 };
        }
        return { slide: next };
      });
    }, ms);
  }

  valid(e) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e.trim()); }

  submit() {
    if (this.state.sending) return;
    const email = this.state.email.trim();
    if (!this.valid(email)) {
      this.setState({ error: 'That email doesn\u2019t look quite right.' });
      return;
    }
    this.setState({ sending: true, error: '' });
    setTimeout(() => this.setState({ sending: false, stage: 'sent' }), 1100);
  }

  reset() {
    this.setState({ stage: 'form', sending: false, error: '' });
    setTimeout(() => { if (this.emailRef.current) this.emailRef.current.focus(); }, 40);
  }

  collapse() {
    this.setState({ modalOpen: false, slide: 0 });
    this.startCycle();
  }
  expand() {
    if (this.cycle) clearInterval(this.cycle);
    this.setState({ modalOpen: true });
  }

  renderVals() {
    const accent = this.props.accent ?? '#4C5FE0';
    const stage = this.state.stage;

    const canSend = this.valid(this.state.email || '');
    const inputStyle = {
      width: '100%',
      textAlign: 'left',
      fontFamily: "'Sora', sans-serif",
      fontSize: '16px',
      color: '#EFEBE0',
      background: 'transparent',
      border: 'none',
      borderBottom: '1px solid rgba(239,235,224,0.28)',
      padding: '10px ' + (canSend ? '30px' : '4px') + ' 10px 4px',
      outline: 'none',
      '--ambit-accent': accent,
    };

    const arrowStyle = {
      position: 'absolute', right: '0', top: '50%',
      transform: 'translateY(-50%)',
      width: '26px', height: '26px',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      cursor: 'pointer',
    };

    const ms = Math.max(320, this.props.slideMs ?? 1200);
    const fade = Math.min(520, Math.round(ms * 0.55));
    const slides = this.SLIDES.map((src, i) => {
      const on = i === this.state.slide;
      return {
        key: i, src,
        style: {
          position: 'absolute', inset: 0, width: '100%', height: '100%',
          backgroundImage: 'url("' + src + '")',
          backgroundSize: 'cover', backgroundPosition: 'center',
          opacity: on ? 1 : 0,
          filter: 'saturate(0.72) contrast(1.06)',
          transition: 'opacity ' + fade + 'ms ease',
        },
      };
    });
    const open = this.state.modalOpen;
    const sheetStyle = {
      position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 5,
      background: '#1B1815',
      borderTop: '0.5px solid rgba(239,235,224,0.1)',
      borderRadius: '28px 28px 0 0',
      padding: '14px 26px 36px',
      boxShadow: '0 -20px 60px rgba(0,0,0,0.45)',
      transform: open ? 'translateY(0)' : 'translateY(100%)',
      transition: 'transform .55s cubic-bezier(.2,.9,.25,1)',
    };
    const scrimStyle = {
      position: 'absolute', inset: 0, zIndex: 4,
      background: 'rgba(9,8,6,0.35)',
      opacity: open ? 1 : 0,
      pointerEvents: open ? 'auto' : 'none',
      transition: 'opacity .4s ease',
    };

    return {
      accent, deviceDark: true, slides,
      sheetStyle, scrimStyle,
      showFloating: !open,
      onCollapse: () => this.collapse(),
      onExpand: () => this.expand(),
      isForm: stage === 'form',
      isSent: stage === 'sent',
      email: this.state.email,
      emailRef: this.emailRef,
      sending: this.state.sending,
      notSending: !this.state.sending,
      canSend,
      hasError: !!this.state.error,
      error: this.state.error,
      inputStyle, arrowStyle,
      onInput: (e) => this.setState({ email: e.target.value, error: '' }),
      onKey: (e) => { if (e.key === 'Enter' && canSend) this.submit(); },
      onSubmit: () => this.submit(),
      onReset: () => this.reset(),
    };
  }
}
</script>
</body>
</html>
