<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #4C5FE0; text-decoration: none; }
    a:hover { color: #7B89EA; }
    @keyframes ambitfade { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes ambitrise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    image-slot { display: block; }
  </style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0C0B09; padding:32px; font-family:-apple-system, system-ui, sans-serif;">

  <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="ambit-slot-stub" hint-size="1px,1px" style="position:absolute; width:0; height:0; overflow:hidden; opacity:0; pointer-events:none;"></x-import>

  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ deviceDark }}" hint-size="402px,874px">
    <div style="position:relative; height:100%;">

      <div style="height:100%; overflow-y:auto; background:#161411; -webkit-overflow-scrolling:touch;">

        <div style="position:sticky; top:0; z-index:8; display:flex; align-items:center; justify-content:space-between; padding:56px 20px 14px; backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%); background:rgba(22,20,17,0.72); border-bottom:0.5px solid rgba(239,235,224,0.08);">
          <a href="Ambit - Profile.dc.html" style="width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(239,235,224,0.06); border:0.5px solid rgba(239,235,224,0.1);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(239,235,224,0.72)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </a>
          <span style="font-family:'Sora', sans-serif; font-weight:600; font-size:17px; color:#EFEBE0;">Settings</span>
          <div style="width:34px;"></div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:20px 20px 0; animation:ambitrise .45s ease both;">
          <a href="Ambit - Profile Edit.dc.html" style="background:rgba(239,235,224,0.04); border:0.5px solid rgba(239,235,224,0.08); border-radius:18px; padding:16px;">
            <sc-if value="{{ hasAvatar }}" hint-placeholder-val="{{ false }}">
              <image-slot id="ambit-avatar" shape="circle" src="{{ avatarSrc }}" placeholder="Photo" style="width:44px; height:44px;"></image-slot>
            </sc-if>
            <sc-if value="{{ noAvatar }}" hint-placeholder-val="{{ true }}">
              <div style="width:44px; height:44px; border-radius:50%; background:linear-gradient(150deg, #8E92F0, #6C7BE8);"></div>
            </sc-if>
            <div style="font-family:'Sora', sans-serif; font-weight:600; font-size:16px; color:#F3EFE5; margin-top:14px;">{{ name }}</div>
            <div style="font-family:'Sora', sans-serif; font-size:13px; color:rgba(239,235,224,0.42); margin-top:3px;">Edit profile</div>
          </a>
          <a href="Ambit - Saved.dc.html" style="background:rgba(239,235,224,0.04); border:0.5px solid rgba(239,235,224,0.08); border-radius:18px; padding:16px;">
            <div style="width:44px; height:44px; border-radius:13px; background:rgba(239,235,224,0.06); border:0.5px solid rgba(239,235,224,0.09); display:flex; align-items:center; justify-content:center;">
              <svg width="16" height="19" viewBox="0 0 24 30"><path d="M2 2h20v26l-10-6.4L2 28z" fill="none" stroke="{{ accent }}" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </div>
            <div style="font-family:'Sora', sans-serif; font-weight:600; font-size:16px; color:#F3EFE5; margin-top:14px;">Everything kept</div>
            <div style="font-family:'Sora', sans-serif; font-size:13px; color:rgba(239,235,224,0.42); margin-top:3px;">{{ savedLabel }}</div>
          </a>
        </div>

        <div style="padding:0 20px 120px;">
          <sc-for list="{{ groups }}" as="group" hint-placeholder-count="4">
            <div>
              <div style="font-family:'Sora', sans-serif; font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:rgba(239,235,224,0.34); margin:30px 4px 10px;">{{ group.title }}</div>
              <div style="background:rgba(239,235,224,0.035); border:0.5px solid rgba(239,235,224,0.08); border-radius:18px; overflow:hidden;">
                <sc-for list="{{ group.rows }}" as="row" hint-placeholder-count="3">
                  <div onClick="{{ row.onClick }}" style="{{ row.style }}">
                    <div style="width:26px; display:flex; align-items:center; justify-content:center; color:rgba(239,235,224,0.6);">{{ row.icon }}</div>
                    <div style="flex:1; font-family:'Sora', sans-serif; font-size:15px; color:#EFEBE0;">{{ row.label }}</div>
                    <sc-if value="{{ row.hasValue }}" hint-placeholder-val="{{ false }}">
                      <div style="{{ row.valueStyle }}">{{ row.value }}</div>
                    </sc-if>
                    <sc-if value="{{ row.hasAction }}" hint-placeholder-val="{{ false }}">
                      <div style="font-family:'Sora', sans-serif; font-size:13px; font-weight:600; color:#0F0E0B; background:{{ accent }}; border-radius:999px; padding:7px 15px;">{{ row.action }}</div>
                    </sc-if>
                    <sc-if value="{{ row.hasChevron }}" hint-placeholder-val="{{ true }}">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(239,235,224,0.32)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>

          <div style="font-family:'Sora', sans-serif; font-size:12px; color:rgba(239,235,224,0.28); text-align:center; margin-top:34px;">Ambit · invite-only · v0.4</div>
        </div>
      </div>

      <sc-if value="{{ toast.active }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; left:50%; bottom:46px; z-index:50; background:rgba(30,28,24,0.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:0.5px solid rgba(239,235,224,0.12); color:#EFEBE0; font-family:'Sora', sans-serif; font-size:13px; padding:11px 18px; border-radius:999px; white-space:nowrap; animation:ambitfade .22s ease both; box-shadow:0 8px 30px rgba(0,0,0,0.4);">{{ toast.text }}</div>
      </sc-if>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:466,&quot;height&quot;:938},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4C5FE0&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#4C5FE0&quot;,&quot;#D9A93C&quot;,&quot;#4C8F5A&quot;,&quot;#C4553D&quot;]}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { toast: null, profile: this.loadProfile(), savedCount: this.loadSavedCount(), quiet: true };
  }
  loadProfile() {
    const base = { name: 'Ben', handle: '@ibenthinkin', avatar: '' };
    try { return Object.assign(base, JSON.parse(localStorage.getItem('ambit.profile.v1') || '{}')); }
    catch (e) { return base; }
  }
  loadSavedCount() {
    try { return (JSON.parse(localStorage.getItem('ambit.saved.v1') || '[]') || []).length; }
    catch (e) { return 0; }
  }
  componentWillUnmount() { if (this.toastTimer) clearTimeout(this.toastTimer); }
  flash(text) {
    if (this.toastTimer) clearTimeout(this.toastTimer);
    this.setState({ toast: text });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 1700);
  }

  icon(path, opts) {
    const o = opts || {};
    return React.createElement('svg', { width: 17, height: 17, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' },
      (Array.isArray(path) ? path : [path]).map((d, i) => React.createElement('path', { key: i, d })),
      o.circle ? React.createElement('circle', { key: 'c', cx: o.circle[0], cy: o.circle[1], r: o.circle[2] }) : null,
    );
  }

  renderVals() {
    const accent = this.props.accent ?? '#4C5FE0';
    const p = this.state.profile;
    const rowStyle = (last) => ({
      display: 'flex', alignItems: 'center', gap: '13px', padding: '15px 16px', cursor: 'pointer',
      borderBottom: last ? 'none' : '0.5px solid rgba(239,235,224,0.07)',
    });
    const valueStyle = (warn) => ({
      fontFamily: "'Sora', sans-serif", fontSize: '13.5px',
      color: warn ? '#D98C6A' : 'rgba(239,235,224,0.42)',
    });

    const mk = (rows) => rows.map((r, i) => ({
      key: r.label, label: r.label, icon: r.icon,
      value: r.value || '', hasValue: !!r.value, valueStyle: valueStyle(!!r.warn),
      action: r.action || '', hasAction: !!r.action,
      hasChevron: !r.action,
      style: rowStyle(i === rows.length - 1),
      onClick: r.onClick || (() => this.flash(r.label + ' \u00b7 coming soon')),
    }));

    const groups = [
      { key: 'account', title: 'Account', rows: mk([
        { label: 'Account details', icon: this.icon(['M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2'], { circle: [12, 7, 4] }), onClick: () => { window.location.href = 'Ambit - Profile Edit.dc.html'; } },
        { label: 'Invite a friend', icon: this.icon(['M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2', 'M19 8v6M22 11h-6'], { circle: [9, 7, 4] }), value: '2 left' },
        { label: 'Add to home screen', icon: this.icon(['M12 3v12', 'M8 11l4 4 4-4', 'M4 19h16']), action: 'Install', onClick: () => { window.location.href = 'Ambit - Install.dc.html'; } },
      ]) },
      { key: 'feed', title: 'Your feed', rows: mk([
        { label: 'What you see', icon: this.icon(['M3 6h18M3 12h12M3 18h7']), value: 'Art, science, history' },
        { label: 'Muted sources', icon: this.icon(['M2 2l20 20', 'M9.9 4.2A9 9 0 0121 12c0 1.3-.3 2.6-.8 3.7']), value: 'None' },
        { label: 'Serendipity', icon: this.icon(['M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1']), value: 'Often' },
      ]) },
      { key: 'permissions', title: 'Permissions', rows: mk([
        { label: 'Camera roll', icon: this.icon(['M3 5h18v14H3z', 'M3 16l5-4 4 3 3-2 6 4']), value: 'Not determined' },
        { label: 'Notifications', icon: this.icon(['M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8', 'M13.7 21a2 2 0 01-3.4 0']), value: 'Off', warn: true },
      ]) },
      { key: 'other', title: 'Other', rows: mk([
        { label: 'Appearance', icon: this.icon(['M12 3a9 9 0 000 18 9 9 0 000-18z', 'M12 3v18']), value: 'Dark' },
        { label: 'Language', icon: this.icon(['M2 12h20', 'M12 2a15 15 0 010 20a15 15 0 010-20'], { circle: [12, 12, 10] }), value: 'English' },
        { label: 'About Ambit', icon: this.icon(['M12 16v-5', 'M12 8h.01'], { circle: [12, 12, 10] }) },
        { label: 'Get in touch', icon: this.icon(['M21 15a2 2 0 01-2 2H8l-5 4V5a2 2 0 012-2h14a2 2 0 012 2z']) },
      ]) },
    ];

    return {
      accent, deviceDark: true,
      name: p.name,
      avatarSrc: p.avatar || '', hasAvatar: !!p.avatar, noAvatar: !p.avatar,
      savedLabel: this.state.savedCount === 1 ? '1 save' : this.state.savedCount + ' saves',
      groups,
      toast: { active: !!this.state.toast, text: this.state.toast || '' },
    };
  }
}
</script>
</body>
</html>
