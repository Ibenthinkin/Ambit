<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ambit-tile hover demo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./ambit-tile.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #161411; color: #EFEBE0; font-family: 'Sora', sans-serif; }
  main { max-width: 1112px; margin: 0 auto; padding: 56px 28px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; color: #F5F1E7; }
  p { margin: 0 0 28px; font-size: 14px; color: rgba(239,235,224,0.55); }
  .feed { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
</style>
</head>
<body>
<main>
  <h1>Tile hover — Lift</h1>
  <p>Hover a tile, or press Tab to see the keyboard focus state.</p>
  <div class="feed">
    <div class="col">
      <a class="ambit-tile ambit-tile--link" href="#" style="padding:20px 16px 22px; text-decoration:none;"><div style="display:flex;align-items:center;gap:7px;"><svg width="8" height="8" viewBox="0 0 10 10"><path d="M5 0l5 5-5 5-5-5z" fill="#6C7BE8"/></svg><span style="font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:rgba(239,235,224,0.4);">Because</span></div><div style="font-size:13px;line-height:1.5;color:rgba(239,235,224,0.6);margin-top:12px;">you’ve been exploring Architecture</div><span class="ambit-tile__to" style="display:block;font-size:16px;line-height:1.35;margin-top:6px;">alien</span></a>
      <a class="ambit-tile" href="#"><img src="demo-assets/1.webp" alt="" style="aspect-ratio:1.053"><span class="ambit-tile__tag">DRIFT</span></a>
      <a class="ambit-tile" href="#"><img src="demo-assets/5.webp" alt="" style="aspect-ratio:0.697"><span class="ambit-tile__tag">CORE</span></a>
    </div>
    <div class="col">
      <a class="ambit-tile" href="#"><img src="demo-assets/2.webp" alt="" style="aspect-ratio:0.731"><span class="ambit-tile__tag">JUMP</span></a>
      <a class="ambit-tile" href="#"><img src="demo-assets/6.webp" alt="" style="aspect-ratio:0.655"><span class="ambit-tile__tag">DRIFT</span></a>
    </div>
    <div class="col">
      <a class="ambit-tile" href="#"><img src="demo-assets/3.webp" alt="" style="aspect-ratio:0.79"><span class="ambit-tile__tag">CORE</span></a>
      <a class="ambit-tile" href="#"><img src="demo-assets/7.webp" alt="" style="aspect-ratio:0.654"><span class="ambit-tile__tag">JUMP</span></a>
      <a class="ambit-tile ambit-tile--link" href="#" style="padding:20px 16px 22px; text-decoration:none;"><div style="display:flex;align-items:center;gap:7px;"><svg width="8" height="8" viewBox="0 0 10 10"><path d="M5 0l5 5-5 5-5-5z" fill="#6C7BE8"/></svg><span style="font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:rgba(239,235,224,0.4);">Because</span></div><div style="font-size:13px;line-height:1.5;color:rgba(239,235,224,0.6);margin-top:12px;">you’ve been exploring Zoology</div><span class="ambit-tile__to" style="display:block;font-size:16px;line-height:1.35;margin-top:6px;">retro-computing</span></a>
    </div>
    <div class="col">
      <a class="ambit-tile" href="#"><img src="demo-assets/4.webp" alt="" style="aspect-ratio:0.715"><span class="ambit-tile__tag">DRIFT</span></a>
      <a class="ambit-tile" href="#"><img src="demo-assets/8.webp" alt="" style="aspect-ratio:1.501"><span class="ambit-tile__tag">CORE</span></a>
    </div>
  </div>
</main>
</body>
</html>
